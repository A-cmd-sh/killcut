name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU版PyTorchで配布サイズを抑える)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --console --name KillCut
          --collect-all easyocr --collect-all librosa --collect-data lazy_loader
          --collect-all torchvision montage.py

      - name: Smoke test
        run: dist\KillCut\KillCut.exe -h

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist\KillCut\
          Compress-Archive -Path dist\KillCut -DestinationPath KillCut-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: KillCut-windows
          path: KillCut-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KillCut-windows.zip
          generate_release_notes: true
